<div class="app" id="app">
  <div class="scrim" id="scrim" onclick="document.querySelector('.app').classList.remove('nav-open')"></div>

  <!-- SIDEBAR (reusable App Shell) -->
  <aside class="side" id="appSidebar" aria-label="Navigasi utama"></aside>

  <!-- MAIN AREA -->
  <div class="main">
    
    <!-- TOPBAR -->
    <header class="top" id="appTopbar"></header>

    <!-- CONTENT -->
    <main class="page">
      <div class="page-head">
        <div>
          <nav class="crumb">
            <a href="../app/dashboard.html">Dashboard</a>
            <span class="sep">/</span>
            <a href="profile.html">Akun Pengguna</a>
            <span class="sep">/</span>
            <b>Ganti Kata Sandi</b>
          </nav>
          <h1>Keamanan Akun &amp; Sandi</h1>
          <p class="sub">Perbarui kata sandi akun Anda secara berkala untuk menjaga keamanan data usaha Anda</p>
        </div>
      </div>

      <!-- Navigation Tabs Akun -->
      <div class="tabs" style="margin-bottom:24px;">
        <a href="profile.html">Profil Saya</a>
        <a href="change-password.html" class="is-on">Keamanan &amp; Sandi</a>
        <a href="preferences.html">Preferensi Akun</a>
      </div>

      <div style="max-width:560px;">
        <div class="card">
          <div id="passMsg" class="alert alert--info" style="display:none;margin-bottom:16px;font-size:.85rem;"></div>
          <form id="changePasswordForm">
            <div class="field">
              <label for="old_pass">Kata Sandi Saat Ini <span class="req">*</span></label>
              <div class="input-group">
                <svg width="18" height="18"><use href="#i-key"/></svg>
                <input class="input input--has-toggle" id="old_pass" type="password" placeholder="Masukkan kata sandi lama" required>
                <button type="button" class="toggle-pass" onclick="togglePassword('old_pass', this)" aria-label="Tampilkan kata sandi">
                  <svg width="18" height="18"><use href="#i-eye-off"/></svg>
                </button>
              </div>
            </div>

            <div class="field">
              <label for="new_pass">Kata Sandi Baru <span class="req">*</span></label>
              <div class="input-group">
                <svg width="18" height="18"><use href="#i-key"/></svg>
                <input class="input input--has-toggle" id="new_pass" type="password" placeholder="Minimal 8 karakter" required minlength="8">
                <button type="button" class="toggle-pass" onclick="togglePassword('new_pass', this)" aria-label="Tampilkan kata sandi">
                  <svg width="18" height="18"><use href="#i-eye-off"/></svg>
                </button>
              </div>
              <div style="margin-top:6px;">
                <div class="bar-track"><div class="bar-fill" style="width:70%; background:var(--green);"></div></div>
                <span class="help" style="display:block; margin-top:4px;">Gunakan kombinasi huruf kapital, angka, dan simbol.</span>
              </div>
            </div>

            <div class="field">
              <label for="confirm_pass">Konfirmasi Kata Sandi Baru <span class="req">*</span></label>
              <div class="input-group">
                <svg width="18" height="18"><use href="#i-key"/></svg>
                <input class="input input--has-toggle" id="confirm_pass" type="password" placeholder="Ketik ulang kata sandi baru" required minlength="8">
                <button type="button" class="toggle-pass" onclick="togglePassword('confirm_pass', this)" aria-label="Tampilkan kata sandi">
                  <svg width="18" height="18"><use href="#i-eye-off"/></svg>
                </button>
              </div>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:12px; flex-wrap:wrap; margin-top:24px; padding-top:18px; border-top:1px solid var(--sand);">
              <button type="reset" class="btn btn--ghost">Reset Form</button>
              <button type="submit" class="btn btn--primary">
                Perbarui Kata Sandi
                <svg width="17" height="17"><use href="#i-check"/></svg>
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script>TH.requireAuth("/auth/login.html");</script>
<script src="/assets/js/app.js"></script>
<script>
function togglePassword(inputId, btn) {
  var input = document.getElementById(inputId);
  var icon = btn.querySelector('use');
  if (input.type === 'password') {
    input.type = 'text';
    icon.setAttribute('href', '#i-eye');
    btn.setAttribute('aria-label', 'Sembunyikan kata sandi');
  } else {
    input.type = 'password';
    icon.setAttribute('href', '#i-eye-off');
    btn.setAttribute('aria-label', 'Tampilkan kata sandi');
  }
}

document.getElementById('changePasswordForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var msg = document.getElementById('passMsg');
  msg.style.display = 'none';
  var oldPass = document.getElementById('old_pass').value;
  var newPass = document.getElementById('new_pass').value;
  var confPass = document.getElementById('confirm_pass').value;

  if (newPass !== confPass) {
    alert('Konfirmasi kata sandi baru tidak cocok.');
    return;
  }

  try {
    await TH.put('/api/account', { old_password: oldPass, new_password: newPass });
    msg.textContent = 'Kata sandi berhasil diperbarui!';
    msg.style.display = 'flex';
    e.target.reset();
  } catch (err) {
    alert('Gagal memperbarui kata sandi: ' + err.message);
  }
});
</script>

<script src="/assets/js/app-shell.js"></script>
</body>
