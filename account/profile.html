<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Saya — TailorHub</title>
<meta name="description" content="Kelola informasi profil pribadi dan data akun pengguna TailorHub.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/logo/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/logo/favicon-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/logo/apple-touch-icon.png">
</head>
<body>

<!-- SVG Sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.6 4.4 4.4L19 6.8"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></symbol>
  <symbol id="i-order" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 3.6h9a1.8 1.8 0 0 1 1.8 1.8v13.2a1.8 1.8 0 0 1-1.8 1.8h-9a1.8 1.8 0 0 1-1.8-1.8V5.4a1.8 1.8 0 0 1 1.8-1.8Z"/><path d="M9.3 3.6V2.4h5.4v1.2"/><path d="M8.9 9.1h6.2M8.9 12.4h6.2M8.9 15.7h3.7"/></symbol>
  <symbol id="i-scissors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.1" cy="18" r="2.6"/><circle cx="17.9" cy="18" r="2.6"/><path d="M7.9 16.1 18.6 4.2M16.1 16.1 5.4 4.2"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.3" cy="8.1" r="3.3"/><path d="M3.4 19.6c0-3.1 2.6-5.3 5.9-5.3s5.9 2.2 5.9 5.3"/><path d="M16.2 5.3a3.2 3.2 0 0 1 0 5.9"/><path d="M17.6 14.8c1.9.6 3.1 2.3 3.1 4.3"/></symbol>
  <symbol id="i-pay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 7.6a2 2 0 0 1 2-2h13.2a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2H5.4a2 2 0 0 1-2-2Z"/><path d="M3.4 10.2h17.2"/><path d="M6.6 14.6h3.1M13.6 14.6h3.8"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 20.4h16.8"/><rect x="5.2" y="12.1" width="3.5" height="8.3" rx="1.1"/><rect x="10.3" y="7.4" width="3.5" height="13" rx="1.1"/><rect x="15.4" y="3.6" width="3.5" height="16.8" rx="1.1"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.3"/><path d="M12 2.6v2.6M12 18.8v2.6M21.4 12h-2.6M5.2 12H2.6M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9M18.6 18.6l-1.9-1.9M7.3 7.3 5.4 5.4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 10.3a5.8 5.8 0 1 1 11.6 0c0 3.4.9 5.1 1.9 6.1H4.3c1-1 1.9-2.7 1.9-6.1Z"/><path d="M10 19.3a2.3 2.3 0 0 0 4 0"/></symbol>
</defs></svg>

<div class="app" id="app">
  <div class="scrim" id="scrim" onclick="document.querySelector('.app').classList.remove('nav-open')"></div>

  <!-- SIDEBAR (reusable App Shell) -->
  <aside class="side" id="appSidebar" aria-label="Navigasi utama"></aside>

  <!-- MAIN AREA -->
  <div class="main">
    
    <!-- TOPBAR -->
    <header class="top" id="appTopbar"></header>

    <!-- CONTENT -->
    <main class="page">
      <div class="page-head">
        <div>
          <nav class="crumb">
            <a href="../app/dashboard.html">Dashboard</a>
            <span class="sep">/</span>
            <a href="profile.html">Akun Pengguna</a>
            <span class="sep">/</span>
            <b>Profil Saya</b>
          </nav>
          <h1>Profil Pengguna</h1>
          <p class="sub">Kelola identitas pribadi, foto profil, dan kontak login akun Anda</p>
        </div>
      </div>

      <!-- Navigation Tabs Akun -->
      <div class="tabs" style="margin-bottom:24px;">
        <a href="profile.html" class="is-on">Profil Saya</a>
        <a href="change-password.html">Keamanan &amp; Sandi</a>
        <a href="preferences.html">Preferensi Akun</a>
      </div>

      <div class="profile-grid">
        
        <!-- Left: Avatar Card -->
        <div class="card" style="text-align:center;">
          <div class="avatar avatar--lg" id="profAvatar" style="width:84px; height:84px; font-size:1.8rem; margin:0 auto 16px;">
            PM
          </div>
          <h3 id="profCardName" style="margin-bottom:4px;">Pak Mardi</h3>
          <p id="profCardMeta" style="font-size:.85rem; color:var(--ink-45); margin-bottom:12px;">Pemilik · Jahit Lestari</p>
          <span class="chip chip--done" id="profStatusChip"><span class="d"></span>Akun Aktif</span>

          <div style="margin-top:20px; padding-top:16px; border-top:1px solid var(--sand); display:grid; gap:8px;">
            <a href="/portal/landing" target="_blank" rel="noopener noreferrer" class="btn btn--primary btn--sm" id="btnTenantLanding" style="display:none;">
              Landing Page Tenant
              <svg width="15" height="15"><use href="#i-arrow"/></svg>
            </a>
            <button type="button" class="btn btn--light btn--sm" id="btnLogoutAccount" style="color:var(--red);">Keluar dari Akun (Logout)</button>
          </div>
        </div>

        <!-- Right: Profile Form -->
        <div class="card">
          <div id="profMsg" class="alert alert--info" style="display:none;margin-bottom:16px;font-size:.85rem;"></div>
          <form id="profileForm">
            <div class="form-row">
              <div class="field">
                <label for="prof_name">Nama Lengkap <span class="req">*</span></label>
                <input class="input" id="prof_name" type="text" value="Pak Mardi" required>
              </div>

              <div class="field">
                <label for="prof_role">Peran Sistem (Role)</label>
                <input class="input" id="prof_role" type="text" value="Pemilik Usaha (Owner)" disabled>
                <span class="help">Peran akun ditentukan oleh paket tenant Anda.</span>
              </div>
            </div>

            <div class="form-row">
              <div class="field">
                <label for="prof_email">Alamat Email Login <span class="req">*</span></label>
                <input class="input" id="prof_email" type="email" value="owner@jahitlestari.id" required>
              </div>

              <div class="field">
                <label for="prof_phone">Nomor WhatsApp Usaha / Kontak <span class="req">*</span></label>
                <input class="input" id="prof_phone" type="tel" value="0812-1111-2222" required>
              </div>
            </div>

            <div class="field">
              <label for="prof_bio">Alamat / Catatan Usaha</label>
              <textarea class="textarea" id="prof_bio" placeholder="Tuliskan alamat atau catatan singkat peran Anda di workshop…">Jakarta</textarea>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:12px; flex-wrap:wrap; margin-top:20px; padding-top:18px; border-top:1px solid var(--sand);">
              <button type="reset" class="btn btn--ghost">Batalkan</button>
              <button type="submit" class="btn btn--primary">
                Simpan Perubahan Profil
                <svg width="17" height="17"><use href="#i-check"/></svg>
              </button>
            </div>
          </form>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script>TH.requireAuth("/auth/login.html");</script>
<script src="/assets/js/app.js"></script>
<script>
(async function () {
  function initials(name) {
    var parts = String(name || "").trim().split(/\s+/);
    if (!parts[0]) return "TH";
    return parts.length > 1 ? (parts[0][0] + parts[1][0]).toUpperCase() : parts[0].slice(0, 2).toUpperCase();
  }
  try {
    var d = await TH.get("/api/account");
    if (d && d.user) {
      var uName = d.user.nama || d.user.name || "Pengguna";
      var tName = (d.tenant && (d.tenant.nama || d.tenant.name)) || "TailorHub";
      var roleLabel = d.user.role === "pemilik" ? "Pemilik Usaha" : d.user.role === "admin" ? "Admin Usaha" : "Staff Produksi";
      document.getElementById("prof_name").value = uName;
      document.getElementById("prof_role").value = roleLabel;
      document.getElementById("prof_email").value = d.user.email || "";
      if (d.tenant && d.tenant.phone) document.getElementById("prof_phone").value = d.tenant.phone;
      if (d.tenant && d.tenant.address) document.getElementById("prof_bio").value = d.tenant.address;
      document.getElementById("profAvatar").textContent = initials(uName);
      document.getElementById("profCardName").textContent = uName;
      document.getElementById("profCardMeta").textContent = roleLabel + " · " + tName;
      var btnTenantLanding = document.getElementById("btnTenantLanding");
      if (btnTenantLanding) {
        if (d.user.role === "pemilik") {
          btnTenantLanding.href = d.tenant && d.tenant.slug
            ? "/portal/landing?slug=" + encodeURIComponent(d.tenant.slug)
            : "/portal/landing";
          btnTenantLanding.style.display = "";
        } else {
          btnTenantLanding.style.display = "none";
        }
      }
    }
  } catch (e) {
    console.error(e);
  }

  document.getElementById("profileForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var msg = document.getElementById("profMsg");
    msg.style.display = "none";
    try {
      var res = await TH.put("/api/account", {
        name: document.getElementById("prof_name").value.trim(),
        email: document.getElementById("prof_email").value.trim(),
        phone: document.getElementById("prof_phone").value.trim(),
        address: document.getElementById("prof_bio").value.trim()
      });
      if (res && res.user) {
        var uName = res.user.nama || res.user.name;
        document.getElementById("profCardName").textContent = uName;
        document.getElementById("profAvatar").textContent = initials(uName);
      }
      msg.textContent = "Perubahan profil berhasil disimpan ke database!";
      msg.style.display = "flex";
    } catch (err) {
      alert("Gagal menyimpan profil: " + err.message);
    }
  });

  document.getElementById("btnLogoutAccount").addEventListener("click", async function () {
    await TH.logout();
    location.href = "/auth/login.html";
  });
})();
</script>
<script src="/assets/js/app-shell.js"></script>
</body>
</html>
