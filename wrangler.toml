# ============================================================
# TailorHub — Konfigurasi Cloudflare Pages + D1
# ------------------------------------------------------------
# - Frontend statis (HTML) di root repo (pages_build_output_dir = ".")
# - Backend = Pages Functions di folder functions/
# - Database = D1 (binding "DB")
#
# LANGKAH:
#   1) npm install
#   2) npx wrangler login
#   3) npm run db:create         -> salin "database_id" yang muncul ke bawah ini
#   4) npm run db:reset          -> buat tabel + isi data demo (lokal)
#   5) npm run dev               -> buka http://localhost:8788
# ============================================================

name = "tailorhub"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# Binding database D1. Ganti database_id dengan hasil "npm run db:create".
[[d1_databases]]
binding = "DB"
database_name = "tailorhub"
database_id = "765597cb-dc9f-481c-b081-c6d5e36bef53"
