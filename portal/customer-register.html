<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Akun Pelanggan — Jahit Lestari · TailorHub</title>
<meta name="description" content="Buat akun pelanggan di Jahit Lestari untuk menyimpan riwayat dan memantau seluruh pesanan jahitan Anda.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/portal.css">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/logo/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/logo/favicon-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/logo/apple-touch-icon.png">
</head>
<body>

<!-- Inline SVG Sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-scissors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.1" cy="18" r="2.6"/><circle cx="17.9" cy="18" r="2.6"/><path d="M7.9 16.1 18.6 4.2M16.1 16.1 5.4 4.2"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.3" cy="8.1" r="3.3"/><path d="M3.4 19.6c0-3.1 2.6-5.3 5.9-5.3s5.9 2.2 5.9 5.3"/><path d="M16.2 5.3a3.2 3.2 0 0 1 0 5.9"/><path d="M17.6 14.8c1.9.6 3.1 2.3 3.1 4.3"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6.4" y="2.6" width="11.2" height="18.8" rx="2.6"/><path d="M10.6 5.2h2.8M10.8 18.6h2.4"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m21 3-9.5 9.5M15.5 7.5l3 3M17.5 5.5l2 2"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61M2 2l20 20"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20Z"/><path d="M12 10v4M12 17h.01"/></symbol>
</defs></svg>

<div class="auth-wrap">
  <div class="auth-box">
    <header class="auth-header">
      <a href="landing.html" class="auth-brand" title="Kembali ke Beranda Jahit Lestari">
        <span class="portal-brand-mark" aria-hidden="true">
          <img class="brand-icon" src="/assets/img/logo/tailorhub-icon.png" alt="" width="30" height="30">
        </span>
        <span>Jahit <em>Lestari</em></span>
      </a>
      <h1>Daftar Akun Pelanggan</h1>
      <p>Simpan arsip ukuran dan pantau semua pesanan Anda di satu tempat</p>
    </header>

    <div class="portal-guest-note">
      <span>Ingin langsung cek status 1 pesanan lewat kode nota?</span>
      <a href="track.html" class="btn btn--ghost btn--sm">
        <svg width="15" height="15"><use href="#i-search"/></svg>
        <span>Lacak Kode</span>
      </a>
    </div>

    <div class="auth-card">
      <form id="customerRegisterForm" novalidate>
        <div class="field">
          <label for="regName">Nama Lengkap <span class="req">*</span></label>
          <div class="input-group">
            <svg width="18" height="18"><use href="#i-users"/></svg>
            <input id="regName" name="name" class="input" type="text" placeholder="Contoh: Dewi Anggraini" required autofocus>
          </div>
        </div>

        <div class="field">
          <label for="regPhone">Nomor WhatsApp <span class="req">*</span></label>
          <div class="input-group">
            <svg width="18" height="18"><use href="#i-phone"/></svg>
            <input id="regPhone" name="phone" class="input" type="tel" placeholder="0812-3456-7890" required>
          </div>
        </div>

        <div class="field">
          <label for="regEmail">Email (Opsional)</label>
          <div class="input-group">
            <svg width="18" height="18"><use href="#i-mail"/></svg>
            <input id="regEmail" name="email" class="input" type="email" placeholder="nama@email.com">
          </div>
        </div>

        <div class="field">
          <label for="regPass">Kata Sandi <span class="req">*</span></label>
          <div class="input-group">
            <svg width="18" height="18"><use href="#i-key"/></svg>
            <input id="regPass" name="password" class="input input--has-toggle" type="password" placeholder="Minimal 6 karakter" minlength="6" required>
            <button type="button" class="toggle-pass" data-target="regPass" aria-label="Tampilkan kata sandi">
              <svg width="18" height="18"><use href="#i-eye-off"/></svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="regConfirm">Konfirmasi Kata Sandi <span class="req">*</span></label>
          <div class="input-group">
            <svg width="18" height="18"><use href="#i-key"/></svg>
            <input id="regConfirm" name="confirmPassword" class="input input--has-toggle" type="password" placeholder="Ulangi kata sandi" minlength="6" required>
            <button type="button" class="toggle-pass" data-target="regConfirm" aria-label="Tampilkan konfirmasi kata sandi">
              <svg width="18" height="18"><use href="#i-eye-off"/></svg>
            </button>
          </div>
        </div>

        <div id="regError" class="alert alert--error" role="alert" style="margin-bottom:14px" hidden>
          <svg width="20" height="20"><use href="#i-warn"/></svg>
          <span id="regErrorMsg">Periksa kembali data pendaftaran Anda.</span>
        </div>

        <button type="submit" class="btn btn--primary btn--block" style="margin-top:6px">
          <span>Buat Akun Pelanggan</span>
          <svg width="17" height="17"><use href="#i-arrow"/></svg>
        </button>
      </form>
    </div>

    <footer class="auth-footer">
      Sudah punya akun pelanggan? <a href="customer-login.html">Masuk di sini</a>
      <div style="margin-top:8px">
        <a href="landing.html" style="color:var(--ink-70);font-weight:600">Kembali ke Beranda Jahit Lestari</a>
      </div>
    </footer>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/portal.js"></script>
<script>
(function () {
  'use strict';

  var portal = window.TailorPortal;
  if (!portal) return;

  var form = document.getElementById('customerRegisterForm');
  var nameInput = document.getElementById('regName');
  var phoneInput = document.getElementById('regPhone');
  var emailInput = document.getElementById('regEmail');
  var passInput = document.getElementById('regPass');
  var confirmInput = document.getElementById('regConfirm');
  var errBox = document.getElementById('regError');
  var errMsg = document.getElementById('regErrorMsg');

  document.querySelectorAll('.toggle-pass[data-target]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var target = document.getElementById(btn.getAttribute('data-target'));
      var icon = btn.querySelector('use');
      if (!target) return;
      if (target.type === 'password') {
        target.type = 'text';
        if (icon) icon.setAttribute('href', '#i-eye');
        btn.setAttribute('aria-label', 'Sembunyikan kata sandi');
      } else {
        target.type = 'password';
        if (icon) icon.setAttribute('href', '#i-eye-off');
        btn.setAttribute('aria-label', 'Tampilkan kata sandi');
      }
    });
  });

  function clearErr() {
    errBox.hidden = true;
    [nameInput, phoneInput, passInput, confirmInput].forEach(function (el) {
      el.classList.remove('input--err');
    });
  }

  [nameInput, phoneInput, passInput, confirmInput].forEach(function (el) {
    el.addEventListener('input', clearErr);
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = nameInput.value.trim();
    var phone = phoneInput.value.trim();
    var email = emailInput.value.trim();
    var pass = passInput.value;
    var confirm = confirmInput.value;

    if (!name || !phone) {
      errMsg.textContent = 'Nama lengkap dan nomor WhatsApp wajib diisi.';
      errBox.hidden = false;
      if (!name) nameInput.classList.add('input--err');
      if (!phone) phoneInput.classList.add('input--err');
      return;
    }

    if (pass.length < 6) {
      errMsg.textContent = 'Kata sandi minimal harus terdiri dari 6 karakter.';
      errBox.hidden = false;
      passInput.classList.add('input--err');
      passInput.focus();
      return;
    }

    if (pass !== confirm) {
      errMsg.textContent = 'Konfirmasi kata sandi tidak cocok.';
      errBox.hidden = false;
      confirmInput.classList.add('input--err');
      confirmInput.focus();
      return;
    }

    portal.setSessionCustomer({
      key: 'registered',
      name: name,
      phone: phone,
      email: email
    });
    window.location.href = 'customer-account.html?welcome=1';
  });
})();
</script>
</body>
</html>
