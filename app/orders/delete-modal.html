<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hapus Pesanan TH-2033 — TailorHub</title>
<meta name="description" content="Konfirmasi penghapusan pesanan jahit TailorHub.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body style="background:rgba(42,24,16,.65);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">

<!-- MODAL BOX KONFIRMASI HAPUS (FR-07) -->
<div class="modal" style="max-width:480px;width:100%;background:var(--paper);border:1px solid var(--sand);box-shadow:var(--shadow-l);">
  <div class="modal-head" style="padding:24px 24px 14px;border-bottom:1px solid var(--sand);">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:42px;height:42px;border-radius:12px;background:var(--red-100);color:var(--red);display:inline-flex;align-items:center;justify-content:center;flex:none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
      </div>
      <div>
        <h3 style="color:var(--red);font-size:1.15rem;">Hapus Pesanan Permanen?</h3>
        <p style="font-size:.82rem;color:var(--ink-45);margin-top:2px;">Tindakan ini tidak dapat dibatalkan</p>
      </div>
    </div>
  </div>

  <div class="modal-body" style="padding:20px 24px;">
    <p style="color:var(--ink-70);font-size:.9rem;line-height:1.55;margin-bottom:16px;">
      Anda akan menghapus data pesanan berikut dari sistem TailorHub:
    </p>

    <!-- Rincian Pesanan Target -->
    <div style="background:var(--cream-200);border:1px solid var(--sand);border-radius:var(--r-m);padding:14px;margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <b style="color:var(--ink);font-size:.95rem;">TH-2033</b>
        <span class="chip chip--finish" style="font-size:.65rem;">Finishing</span>
      </div>
      <div style="font-size:.85rem;font-weight:700;color:var(--ink-70);">Jas Formal ×1</div>
      <div style="font-size:.8rem;color:var(--ink-45);margin-top:2px;">Pemesan: Hendra Wibowo (0812-9876-5432)</div>
      <div style="font-size:.8rem;color:var(--red);font-weight:700;margin-top:6px;">
        Catatan: Pesanan memiliki pembayaran tercatat (DP Rp 1.250.000).
      </div>
    </div>

    <label class="check" style="font-size:.84rem;color:var(--ink);line-height:1.4;">
      <input type="checkbox" id="confirmDelete" required>
      <span>Saya memahami bahwa penghapusan ini akan menghapus seluruh data ukuran pola, timeline pengerjaan, dan tautan tracking mandiri pelanggan.</span>
    </label>
  </div>

  <div class="modal-foot" style="padding:16px 24px;display:flex;justify-content:flex-end;gap:12px;background:var(--cream);border-top:1px solid var(--sand);">
    <a href="detail.html" class="btn btn--ghost btn--sm">Batal</a>
    <button type="button" class="btn btn--danger btn--sm" onclick="alert('Pesanan TH-2033 telah berhasil dihapus.');location.href='index.html';">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <span>Hapus Pesanan Permanen</span>
    </button>
  </div>
</div>

</body>
</html>
