<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — TailorHub</title>
<meta name="description" content="Masuk ke akun usaha jahit dan konveksi TailorHub Anda.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/logo/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/logo/favicon-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/logo/apple-touch-icon.png">
</head>
<body>

<!-- SVG Sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.6 4.4 4.4L19 6.8"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m21 3-9.5 9.5M15.5 7.5l3 3M17.5 5.5l2 2"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61M2 2l20 20"/></symbol>
</defs></svg>

<div class="auth-wrap">
  <div class="auth-box">
    
    <header class="auth-header">
      <a href="../index.html" class="auth-brand" title="Kembali ke Beranda TailorHub">
        <img class="brand-icon" src="/assets/img/logo/tailorhub-icon.png" alt="" width="36" height="36" aria-hidden="true" style="object-fit:contain;flex:none;">
        <span>Tailor<em>Hub</em></span>
      </a>
      <h1>Masuk ke Akun Anda</h1>
      <p>Kelola pesanan, produksi, dan keuangan usaha jahit Anda</p>
    </header>

    <div class="auth-card">
      <div id="loginError" class="alert alert--warn" style="display:none;margin-bottom:16px;background:var(--red);border-color:var(--red);color:#fff;font-size:.85rem;"></div>
      <form id="loginForm" action="/app/dashboard.html" method="GET">
        <div class="field">
          <label for="email">Email Usaha / Pengguna <span class="req">*</span></label>
          <div class="input-group">
            <svg width="18" height="18"><use href="#i-mail"/></svg>
            <input class="input" id="email" type="email" placeholder="owner@jahitlestari.id" required autofocus>
          </div>
        </div>

        <div class="field">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label for="password">Kata Sandi <span class="req">*</span></label>
            <a href="forgot-password.html" style="font-size:.78rem; font-weight:700; color:var(--clay);">Lupa sandi?</a>
          </div>
          <div class="input-group">
            <svg width="18" height="18"><use href="#i-key"/></svg>
            <input class="input input--has-toggle" id="password" type="password" placeholder="••••••••" required>
            <button type="button" class="toggle-pass" onclick="togglePassword('password', this)" aria-label="Tampilkan kata sandi">
              <svg width="18" height="18"><use href="#i-eye-off"/></svg>
            </button>
          </div>
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; margin:16px 0 22px;">
          <label class="check">
            <input type="checkbox" name="remember" checked>
            <span>Ingat saya di perangkat ini</span>
          </label>
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn btn--primary btn--block">
          Masuk ke Dashboard
          <svg width="17" height="17"><use href="#i-arrow"/></svg>
        </button>
      </form>

      <div style="margin-top:20px; padding-top:16px; border-top:1px dashed var(--sand); text-align:center;">
        <span style="font-size:.78rem; color:var(--ink-45); display:block; margin-bottom:8px;">Klik Peran Demo untuk Isi Cepat:</span>
        <div style="display:flex; gap:6px; justify-content:center; flex-wrap:wrap;">
          <button type="button" class="chip chip--soft" style="font-size:.7rem;cursor:pointer;border:0" onclick="fillDemo('owner@jahitlestari.id')">Pemilik</button>
          <button type="button" class="chip chip--soft" style="font-size:.7rem;cursor:pointer;border:0" onclick="fillDemo('admin@jahitlestari.id')">Admin</button>
          <button type="button" class="chip chip--soft" style="font-size:.7rem;cursor:pointer;border:0" onclick="fillDemo('staff@jahitlestari.id')">Staff Produksi</button>
        </div>
      </div>
    </div>

    <footer class="auth-footer">
      Belum memiliki akun usaha? <a href="register.html">Daftar sekarang</a>
    </footer>

  </div>
</div>

<script src="/assets/js/api.js"></script>
<script>
function togglePassword(inputId, btn) {
  var input = document.getElementById(inputId);
  var icon = btn.querySelector('use');
  if (input.type === 'password') {
    input.type = 'text';
    icon.setAttribute('href', '#i-eye');
    btn.setAttribute('aria-label', 'Sembunyikan kata sandi');
  } else {
    input.type = 'password';
    icon.setAttribute('href', '#i-eye-off');
    btn.setAttribute('aria-label', 'Tampilkan kata sandi');
  }
}

function fillDemo(email) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = 'password123';
}

document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var errBox = document.getElementById('loginError');
  var btn = document.getElementById('btnLoginSubmit');
  errBox.style.display = 'none';
  btn.disabled = true;
  try {
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    await TH.login(email, password);
    location.href = '/app/dashboard.html';
  } catch (err) {
    errBox.textContent = err.message || 'Gagal masuk. Periksa email dan kata sandi.';
    errBox.style.display = 'flex';
    btn.disabled = false;
  }
});
</script>

</body>
</html>
